name: VPN Health and Geo Check

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

concurrency:
  group: papa-vpn-health-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run health and geolocation checks
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_HEALTH_SECRET: ${{ secrets.WORKER_HEALTH_SECRET }}
          TCP_TIMEOUT_MS: "3500"
          DNS_TIMEOUT_MS: "3000"
          DNS_CONCURRENCY: "60"
          TCP_CONCURRENCY: "80"
        run: node scripts/health-check.mjs
